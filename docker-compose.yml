services:
  freqtrade:
    # Sabit sürüm: bilerek güncellenir, asla kazara değil.
    image: freqtradeorg/freqtrade:2026.9
    container_name: freqtrade
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - ./user_data:/freqtrade/user_data
    # Tek seferlik komutlar (download-data, backtesting, ...) için:
    #   docker compose run --rm freqtrade <komut> ...
    # Bu, aşağıdaki varsayılan "trade" komutunun yerine geçer.
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy ${STRATEGY:-EmaAdxTrend}

  # Sadece analiz/backtest raporları için (bot bunu kullanmaz). Çalıştırma:
  #   docker compose --profile research run --rm research <script.py> ...
  research:
    build:
      context: docker
      dockerfile: research.Dockerfile
    image: tradeist-research:2026.9
    profiles: ["research"]
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./reports:/freqtrade/reports
    entrypoint: ["python"]
